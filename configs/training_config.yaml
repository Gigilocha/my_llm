# Конфиг для базового обучения модели
pre_training:
  max_len: 2048                      # длина чанков из dataloader, частая практика — начать с короткого контекста для скорости, потом дотренеровать до полного
  batch_size: 8                      # сколько последовательностей физически помещается в один forward-проход на GPU
  gradient_accumulation_steps: 2      # колько таких мини-батчей накопить перед реальным шагом оптимизатора, чтобы эффективный размер батча был больше, чем позволяет память GPU
  max_steps: 95001                 # сколько всего шагов обучения сделать
  learning_rate: 0.0003               # целевое/пиковое значение изменения весов в обучении
  warmup_steps: 1000                  # несколько первых сотен/тысяч шагов lr растёт от почти нуля до целевого значения — это защищает от нестабильности в самом начале, когда веса ещё случайные
  min_learning_rate: 0.00003          # до какого значения rl затухать
  grad_clip_norm: 1.0                 # защита от "взрыва" градиентов, максимальная норма градиента, если превышена — обрезается
  weight_decay: 0.1                   # регуляризация, штраф за слишком большие веса
  eval_interval: 500                  # как часто прогонять eval
  checkpoint_interval: 5000           # как часто сохранять чекпоинты модели в обучении


# Конфиг для тонкого обучения модели (sft)
sft:
  # СТАРТОВЫЙ конфиг — пересчитай max_steps/warmup_steps, когда узнаешь
  # реальное количество валидных примеров после кеширования (аналогично тому,
  # как считали max_steps для pretrain через реальный объём данных)
  max_len: 2048
  batch_size: 8
  gradient_accumulation_steps: 2
  max_steps: 5000
  learning_rate: 0.00005
  warmup_steps: 100
  min_learning_rate: 0.000005
  grad_clip_norm: 1.0
  weight_decay: 0.01
  eval_interval: 200
  checkpoint_interval: 500
  # SFT — тонкая настройка, не обучение с нуля: LR заметно ниже, чем в pretrain
  # (learning_rate здесь в ~6 раз меньше, чем pretrain.learning_rate; то же
  # соотношение сохранено между muon_learning_rate и learning_rate, что и в pretrain)
  muon_learning_rate: 0.003
  muon_weight_decay: 0.0
  muon_momentum: 0.95


# Конфиг для тонкого обучения модели (rlft)
rlft: {}
