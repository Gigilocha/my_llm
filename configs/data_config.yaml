# Данные для pre-trainig
pre_training_data:
  rows_per_shard: 50000
  seed: 42
  val_split_ratio: 0.01

  # Процентное распределение по языкам, % от общего датасета
  rus_quantity: 46
  en_quantity: 31
  code_quantity: 23

  # Количество документов для кеширования
  rus_cache_docs: 1200000 
  en_cache_docs: 800000
  code_cache_docs: 600000

  # Русский язык
  rus_sources:
      # Не формальный датасет с разнообразием разговорных предложений 
    - dataset_name: HuggingFaceFW/fineweb-2
      subset: rus_Cyrl
      split: train
      weight: 0.7 # Параметр веса источника, чем больше параметр, тем чаще шард будет выбран из всех данных, при 1 данные будут чередоваться 
      
      # Датасет википедии с фактами и историей
    - dataset_name: wikimedia/wikipedia
      subset: 20231101.ru
      split: train
      weight: 0.3

  # Англиский язык
  en_sources:
    - dataset_name: HuggingFaceFW/fineweb
      split: train
      weight: 1.0

  # Код 
  code_sources:
      # Python
    - dataset_name: HuggingFaceCode/stack-v3-train
      split: train
      weight: 1.0
      language_filter: Python
      cache_name: python
  
# --------------------------------------------------------------------  

# Данные для SFT
# Инструкционное обучение не подразумевает код без инстукций на естественном языке
# Разделение идет по парно в зависимости от задачи (русский язык + код, англиский язык + общие знания)
sft_data:
  seed: 42
  val_split_ratio: 0.01
  cache_docs_per_source: 5000

  sources:
      # Русский язык (общие знания)
    - dataset_name: concretejungles/T-Wix-instag
      split: train
      weight: 1.0
      target_share: 40
      messages_field: messages
      filter_field: supertag
      filter_values: [general-knowledge]
      cache_name: t-wix-general

      # Русский язык (код)
    - dataset_name: concretejungles/T-Wix-instag
      split: train
      weight: 1.0
      target_share: 40
      messages_field: messages
      filter_field: supertag
      filter_values: [code]
      cache_name: t-wix-code

      # Английский язык (общие знания)
    - dataset_name: nyuuzyou/EagleSFT
      split: en
      weight: 1.0
      target_share: 20
      messages_field: messages

# ---------------------------------------------------------------------

# Данные для RLFT
# Данные для обучения с подкреплением (парные данные, хороший/плохой ответ)
rlft_data:
  cache_docs_per_source: 50000
  val_split_ratio: 0.01
  seed: 42

  sources:
      # Русский (переведённый hh-rlhf)
    - dataset_name: d0rj/hh-rlhf-ru
      split: train
      weight: 1.0
      target_share: 70
      prompt_field: prompt
      chosen_field: chosen
      rejected_field: rejected
      as_messages: false
      cache_name: hh-rlhf-ru

      # Английский (Tulu 3 preference mixture)
    - dataset_name: allenai/llama-3.1-tulu-3-8b-preference-mixture
      split: train
      weight: 1.0
      target_share: 30
      prompt_field: prompt
      chosen_field: chosen
      rejected_field: rejected
      as_messages: true
      cache_name: tulu3-preference-mix

# ---------------------------------------------------------------------

# Данные для Benchmark
benchmark_data:
  seed: 42

  sources:
      # Русский, multiple-choice (10 вариантов, аналог MMLU-Pro) — поля предположительны,
      # свериться через первый документ перед запуском (см. _peek_and_validate_fields)
    - dataset_name: t-tech/ruMMLU-pro
      split: test
      task_type: multiple_choice
      question_field: question
      options_field: options
      answer_index_field: answer_index
      cache_name: ru-mmlu-pro

      # Английский, multiple-choice (10 вариантов)
    - dataset_name: TIGER-Lab/MMLU-Pro
      split: test
      task_type: multiple_choice
      question_field: question
      options_field: options
      answer_index_field: answer_index
      cache_name: mmlu-pro

      # Английский, генерация с числовым ответом после "####"
    - dataset_name: openai/gsm8k
      subset: main
      split: test
      task_type: generation
      question_field: question
      answer_field: answer
      answer_extract_pattern: '####\s*([\-0-9,.]+)'
      cache_name: gsm8k
