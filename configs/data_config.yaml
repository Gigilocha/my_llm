# Данные для pre-trainig
pre_training_data:
  max_shard: 6542
  seed: 42
  val_split_ratio: 0.01

  rus_sources:
    - dataset_name: HuggingFaceFW/fineweb-2
      subset: rus_Cyrl
      split: train
      weight: 0.7
    - dataset_name: wikimedia/wikipedia
      subset: 20231101.ru
      split: train
      weight: 0.3
  rus_quantity: 60   # % от общего датасета

  en_sources:
    - dataset_name: HuggingFaceFW/fineweb
      split: train
      weight: 1.0
  en_quantity: 20

  code_sources:
    - dataset_name: OpenCoder-LLM/opc-fineweb-code-corpus
      split: train
      weight: 1.0
  code_quantity: 20

  # Кеширование данных на диск
  rus_cache_docs: 3500000
  en_cache_docs: 1500000
  code_cache_docs: 2000000
  

# Данные для fine-tuning (SFT)
sft_data:
  # ВНИМАНИЕ: имена полей — предположение по описанию. cache_sft_data()
  # упадёт с понятной ошибкой и списком реальных полей при первом расхождении
  sources:
    # T-Wix-instag, код (supertag=code) — 121686 строк / 24.36% в источнике.
    # Отдельный источник от "остального" T-Wix (см. ниже), чтобы не задваивать
    # одни и те же примеры в обоих пулах и контролировать долю кода независимо
    - dataset_name: concretejungles/T-Wix-instag
      split: train
      weight: 1.5
      messages_field: messages
      filter_field: supertag
      filter_values: [code]
      cache_name: t-wix-code

    # T-Wix-instag, всё остальное — явный список всех supertag, КРОМЕ code
    # (не "not code", а конкретный список — наш фильтр matching-по-списку,
    # не exclusion; таксономия версии 2026-04-28: math/code/science/
    # general-instruction/general-knowledge/writing)
    - dataset_name: concretejungles/T-Wix-instag
      split: train
      weight: 1.0
      messages_field: messages
      filter_field: supertag
      filter_values: [math, science, general-instruction, general-knowledge, writing]
      cache_name: t-wix-general

    - dataset_name: nyuuzyou/EagleSFT
      split: en
      weight: 1.0
      messages_field: messages

  # Vibe-Coding-Instruct убран: проверили глазами — вопреки названию, кода
  # там нет вообще, только английский текст. T-Wix-code (выше) его заменяет
  cache_docs_per_source: 200000
  val_split_ratio: 0.01
  seed: 42


# Данные для fine-tuning (RLFT)
rlft_data:
  rus_sources: []
  en_sources: []
  code_sources: []


