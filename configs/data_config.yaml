# Данные для pre-trainig
pre_training_data:
  max_shard: 6542
  seed: 42
  val_split_ratio: 0.01

  # Русский язык
  rus_sources:
    - dataset_name: HuggingFaceFW/fineweb-2
      subset: rus_Cyrl
      split: train
      weight: 0.7
    - dataset_name: wikimedia/wikipedia
      subset: 20231101.ru
      split: train
      weight: 0.3
  rus_quantity: 60   # % от общего датасета
  rus_cache_docs: 1200000 # Размер кеширование данных на диск (в документах)

  # Английский язык
  en_sources:
    - dataset_name: HuggingFaceFW/fineweb
      split: train
      weight: 1.0
  en_quantity: 20
  en_cache_docs: 400000

  # Код
  code_sources:
    - dataset_name: HuggingFaceCode/stack-v3-train
      split: train
      weight: 1.0
  code_quantity: 20
  code_cache_docs: 400000
  
# --------------------------------------------------------------------------------------

# Данные для fine-tuning (SFT)
sft_data:
  max_shard: 6542
  seed: 42
  val_split_ratio: 0.01

  # Русский язык
  rus_sources:
    dataset_name: T-Wix/sft-mixture
    split: train
    weight: 1.0
  rus_quantity: 60
  rus_cache_docs: 300000

  # Англиский язык
  en_sources: 
    dataset_name: OpenAssistant/oasst1
    split: train
    weight: 1.0
  en_quantity: 20
  en_cache_docs: 100000

  # Код
  code_sources: 
    dataset_name: T-Wix/code_instructions
    split: train
    weight: 1.0
  code_quantity: 20
  code_cache_docs: 100000

# ----------------------------------------------------------------------------------------

# Данные для fine-tuning (RLFT)
rlft_data:
  max_shard: 6542
  seed: 42
  val_split_ratio: 0.01

  # Русский язык
  rus_sources:
    dataset_name: T-Wix/rm_mixture
    split: train
    weight: 1.0
  rus_quantity: 60
  rus_cache_docs: 150000

  # Англиский язык
  en_sources: 
    dataset_name: Anthropic/hh-rlhf
    split: train
    weight: 1.0
  en_quantity: 20
  en_cache_docs: 50000

  # Код
  code_sources: 
    dataset_name: bigcode/humanevalpack
    split: train
    weight: 1.0
  code_quantity: 20
  code_cache_docs: 50000 


