# Параметры модели 
model: 
  hidden_size: 768
  num_layers: 8
  vocab_size: 16384
  max_position_embeddings: 2048
  norm_eps: 0.000001


# Параметры мехинизма внимания
attention:
  num_heads: 12
  num_kv_heads: 4
  head_dim: 64
  rope_theta: 10000.0
  use_qk_norm: true
  qk_norm_eps: 0.000001


# Параметры MLP
mlp:
  intermediate_size: 2048


