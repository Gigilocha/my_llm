# Параметры модели 
model: 
  hidden_size: 768
  num_layers: 12
  vocab_size: 65536 
  max_position_embeddings: 6144
  norm_eps: 0.000001
  window_pattern: "L"


# Параметры мехинизма внимания
attention:
  num_head: 12
  num_kv_head: 4
  head_dim: 64
  rope_theta: 10000.0
  use_qk_norm: true
  qk_norm_eps: 0.000001


# Параметры MLP
mlp:
  intermediate_size: 2048


