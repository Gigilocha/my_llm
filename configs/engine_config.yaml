# Параметры генерации по умолчанию — используются base_eval.py, sft_eval.py и
# GenerationEngine, если конкретный вызов их явно не переопределяет (например,
# через CLI-флаги --temperature/--top-k у base_eval.py)

use_kv_cache: true       # GenerationEngine (с KV-кешем) vs generate.py (наивный, без кеша)
max_new_tokens: 100
temperature: 0.7
top_k: 50
top_p: null
repetition_penalty: 1.3
